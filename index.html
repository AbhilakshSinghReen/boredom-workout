<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Randomizer</title>

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .card {
            background: var(--card);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            color: var(--accent);
        }

        .exercise-name {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .details {
            font-size: 1rem;
            opacity: 0.85;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--accent);
            color: #0f172a;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card" id="display">
            <h1>Workout Randomizer</h1>
            <div class="exercise-name">Press the button</div>
            <div class="details">to get an exercise</div>
        </div>

        <button onclick="pickExercise()">Get Random Exercise</button>
    </div>

    <script>
        // ===== EDIT YOUR EXERCISES HERE =====
        const exercises = [
            { name: "Squats", reps: 50, weight: "Bodyweight" },
            // { name: "1-leg Squats (Each Leg)", reps: 25, weight: "Bodyweight" },
            { name: "Knee Pushups", reps: 25, weight: "Bodyweight" },
            // { name: "Lying Leg Raises", reps: 50, weight: "Bodyweight" },
            { name: "Hanging Knee Raises", reps: 50, weight: "Bodyweight" },
            { name: "Lateral Raises (Each Arm)", reps: 25, weight: "10kg" },
            { name: "Pullups (with Chair)", reps: 25, weight: "Bodyweight" },
            { name: "Back Shrugs (Each Arm)", reps: 25, weight: "10kg" },
            { name: "Compound Shoulder Press", reps: 50, weight: "10kg" },
            { name: "Side Plank Dynamic (Each Side)", reps: 25, weight: "Bodyweight" },
            { name: "Jumps", reps: 20, weight: "Bodyweight" },
            { name: "Jumps", reps: 25, weight: "Bodyweight" },
        ];
        // ===================================

        function pickExercise() {
            const randomIndex = Math.floor(Math.random() * exercises.length);
            const ex = exercises[randomIndex];

            document.getElementById("display").innerHTML = `
        <h1>Workout Randomizer</h1>
        <div class="exercise-name">${ex.name}</div>
        <div class="details">
          Reps: ${ex.reps}<br>
          Weight: ${ex.weight}
        </div>
      `;
        }
    </script>
</body>

</html>
